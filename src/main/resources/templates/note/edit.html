<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit Note | Playful Kanban & Notes')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanbanPop! | Edit Note</title>
</head>
<body>

    <!-- Header Navbar -->
    <header th:replace="~{fragments/layout :: navbar}"></header>

    <!-- Global Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <!-- Main Container -->
    <main class="container py-5" style="max-width: 760px;">
        
        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
            <a th:href="@{/notes}" class="btn-candy btn-candy-white btn-candy-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to Notes
            </a>
            
            <form th:action="@{'/notes/' + ${noteId} + '/delete'}" method="post" class="m-0"
                  onsubmit="return confirm('Are you sure you want to delete this sticky note?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-candy btn-candy-secondary btn-candy-sm">
                    <i class="fa-solid fa-trash me-1"></i> Delete Note
                </button>
            </form>
        </div>

        <div class="sticker-card p-4 p-md-5" style="background: #FFFFFF;">
            
            <div class="d-flex align-items-center gap-2 mb-3">
                <span class="badge border border-dark rounded-pill px-3 py-1" style="background: var(--tertiary-yellow-light); color: var(--text-main); font-weight: 700;">
                    <i class="fa-solid fa-pen-to-square text-primary me-1"></i> Note Editor
                </span>
            </div>

            <h1 class="h2 fw-black mb-4">Edit Sticky Note</h1>

            <form th:action="@{'/notes/' + ${noteId} + '/edit'}" th:object="${note}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Title Field -->
                <div class="mb-3">
                    <label for="editNoteTitle" class="form-label fw-bold">Note Title <span class="text-danger">*</span></label>
                    <input type="text" id="editNoteTitle" th:field="*{title}" class="form-control form-control-playful" 
                           placeholder="Note title..." required maxlength="120">
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger small mt-1 fw-bold"></div>
                </div>

                <!-- Content Field -->
                <div class="mb-3">
                    <label for="editNoteContent" class="form-label fw-bold">Note Content <span class="text-danger">*</span></label>
                    <textarea id="editNoteContent" th:field="*{content}" class="form-control form-control-playful" 
                              rows="6" placeholder="Write your thoughts..." required></textarea>
                    <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-danger small mt-1 fw-bold"></div>
                </div>

                <!-- Sticky Color Selector -->
                <div class="mb-4">
                    <label class="form-label fw-bold d-block">Sticky Note Color</label>
                    <div class="color-picker-grid">
                        
                        <label class="color-option-label" style="background: #FEF08A;">
                            <input type="radio" th:field="*{color}" value="yellow">
                            <span class="color-swatch-circle" style="background: #FACC15;"></span>
                            <span>Lemon Yellow</span>
                        </label>

                        <label class="color-option-label" style="background: #FBCFE8;">
                            <input type="radio" th:field="*{color}" value="pink">
                            <span class="color-swatch-circle" style="background: #F472B6;"></span>
                            <span>Bubblegum Pink</span>
                        </label>

                        <label class="color-option-label" style="background: #A7F3D0;">
                            <input type="radio" th:field="*{color}" value="mint">
                            <span class="color-swatch-circle" style="background: #34D399;"></span>
                            <span>Fresh Mint</span>
                        </label>

                        <label class="color-option-label" style="background: #DDD6FE;">
                            <input type="radio" th:field="*{color}" value="violet">
                            <span class="color-swatch-circle" style="background: #8B5CF6;"></span>
                            <span>Electric Violet</span>
                        </label>

                        <label class="color-option-label" style="background: #BAE6FD;">
                            <input type="radio" th:field="*{color}" value="blue">
                            <span class="color-swatch-circle" style="background: #38BDF8;"></span>
                            <span>Sky Blue</span>
                        </label>

                        <label class="color-option-label" style="background: #FED7AA;">
                            <input type="radio" th:field="*{color}" value="peach">
                            <span class="color-swatch-circle" style="background: #FB923C;"></span>
                            <span>Warm Peach</span>
                        </label>

                    </div>
                </div>

                <!-- Category & Board Selection Row -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="editNoteCategory" class="form-label fw-bold">Category / Tag</label>
                        <input type="text" id="editNoteCategory" th:field="*{category}" class="form-control form-control-playful"
                               placeholder="e.g. Architecture, Ideas" maxlength="50">
                    </div>

                    <div class="col-md-6">
                        <label for="editNoteBoardId" class="form-label fw-bold">Attach to Board (Optional)</label>
                        <select id="editNoteBoardId" th:field="*{boardId}" class="form-select form-control-playful">
                            <option value="">None (General Workspace Note)</option>
                            <option th:each="b : ${boards}" th:value="${b.id}" th:text="${b.title}">Board Title</option>
                        </select>
                    </div>
                </div>

                <!-- Pin Checkbox -->
                <div class="form-check p-3 rounded-3 mb-4" style="background: var(--tertiary-yellow-light); border: 2px solid #1E293B;">
                    <input class="form-check-input" type="checkbox" id="editNotePinned" th:field="*{pinned}" style="border: 2px solid #1E293B;">
                    <label class="form-check-label fw-bold ms-2" for="editNotePinned">
                        <i class="fa-solid fa-thumbtack text-danger me-1"></i> Pin this note to top of the board
                    </label>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <button type="submit" class="btn-candy btn-candy-primary px-4 py-2">
                        <i class="fa-solid fa-check"></i> Save Changes
                    </button>
                    <a th:href="@{/notes}" class="btn-candy btn-candy-secondary px-4 py-2">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
